[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = [
    "supervised_learning/campaign_response_propensity/src",
    "unsupervised_learning/customer_segmentation/src",
]
